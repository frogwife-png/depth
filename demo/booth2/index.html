<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내부 표준화 | 대구형평가플랫폼</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
<style>
.pin{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:#6b7280;background:#fff}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);padding:26px 30px 22px;position:relative}
.stp{display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;font-size:13.5px;color:#4b5563;font-weight:600}
.stp::before{content:'';position:absolute;top:21px;left:calc(-50% + 26px);right:calc(50% + 26px);height:1.5px;background:#e5e7eb}
.stp:first-child::before{display:none}
.stp.done::before,.stp.cur::before{background:#f3c9a4}
.stp .c{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #e5e7eb;background:#fff;color:#6b7280;font-weight:700;position:relative;z-index:1}
.stp.done .c{border-color:#f0b98d;color:#c2410c;background:#fffaf5}
.stp.cur .c{background:#a3430e;border-color:#a3430e;color:#fff;box-shadow:0 0 0 5px #fbe3d1}
.stp.cur{color:#c2410c}
.crit-el{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.crit-row{display:grid;grid-template-columns:120px 1fr 64px 56px;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line-3)}
.crit-row:last-child{border-bottom:0}
.crit-row.head{background:#f8fafc;font-weight:700}
.crit-row .lv{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px}
.lv.h{background:#e6f3ed;color:#227356}.lv.m{background:#eef4ff;color:#1d4ed8}.lv.l{background:#fdecea;color:#c0392b}
.crit-row .txt{border:1px solid #e5e7eb;border-radius:8px;padding:8px 11px;background:#fafbfc;color:#374151;font-size:13.5px;line-height:1.6}
.crit-row textarea.txt{background:#fff;min-height:44px;resize:none;outline:none;border-color:#c7d2fe}
.crit-row textarea.txt:focus{border-color:#3b76ff;box-shadow:0 0 0 3px rgba(59,118,255,.15)}
.crit-row .k{color:#64748b;font-size:12.5px;text-align:center}
.crit-row .v{font-weight:800;text-align:center}
.mine-tag{font-size:11px;font-weight:700;color:#6d28d9;background:#ede9fe;border-radius:6px;padding:2px 7px;margin-left:6px}
.foot-bar{position:sticky;bottom:-120px;margin-top:18px;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.foot-bar .note{margin:0 auto;color:#c2410c;font-size:13px;display:flex;gap:6px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;justify-content:space-between}
.kpi small{color:#4b5563;font-size:13px}.kpi b{display:block;font-size:28px;font-weight:800;margin-top:4px}.kpi b em{font-style:normal;font-size:14px;color:#6b7280;margin-left:3px;font-weight:600}
.kpi .ic{width:44px;height:44px;border-radius:12px;background:#eef4ff;color:#2563eb;display:grid;place-items:center}
.kpi .ic.o{background:#fff3e6;color:#c2410c}
.judge{margin-top:14px;background:#f1f5f9;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#475569;display:flex;gap:14px;flex-wrap:wrap}
.judge b{color:#111827}
.thr{display:flex;gap:8px}
.thr span{font-size:12px;font-weight:700;border:1px solid #bfd3fa;color:#1d4ed8;background:#f5f8ff;border-radius:20px;padding:4px 10px}
.me-row td{background:#faf7ff}
.me-row td:first-child{box-shadow:inset 3px 0 0 #7c5cd6}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
.cmp .c{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.cmp .c h5{font-size:13.5px;margin-bottom:8px}
.cmp .c .r{display:flex;justify-content:space-between;font-size:13px;color:#475569;padding:2px 0}
.cmp .c .r b{color:#111827}
.cmp .c.diff{border-color:#fbcfa8;background:#fffaf5}
</style></head>
<body>
<main class="app-main" id="main"></main>
<div id="dmRoot"></div>
<script src="assets/app.js"></script>
<script>
(function(){
const I=Demo.icon, esc=Demo.esc;
const LV=['상','중','하'];
const EL=[
 {name:'핵심 개념과 조건 이해',pt:4,c:['화자의 태도를 한 가지로 정확히 정리하고 문항 조건을 모두 지킨다.','화자의 태도를 정리했지만 조건 일부가 빠져 있다.','화자의 태도를 파악하기 어렵다.'],p:[4,2,0]},
 {name:'근거 또는 풀이 과정',pt:3,c:['지문에서 근거 두 가지를 찾아 태도와 정확히 연결한다.','근거를 하나만 들었거나 태도와의 연결이 부족하다.','지문에서 근거를 찾지 못했다.'],p:[3,1,0]},
 {name:'결론의 타당성과 표현',pt:3,c:['판단 과정이 자연스럽고 표현이 정확하다.',null,'결론과 근거가 연결되지 않는다.'],p:[3,1,0]}
];
const STD=[0,1,1]; // 선임채점관 기준채점: 상·중·중 = 6점
const ANSWER='화자는 지난 일을 떠올리면서도 쉽게 무너지지 않으려는 태도를 보인다. 흔들려도 끝내 뒤집히지 않는 종이배가 이런 마음을 보여 준다. 그래서 화자는 슬프지만 버티는 사람이라고 생각한다.';
const steps4=['표본 답안 채점','세부 채점 기준 확정','연습 채점','채점자 최종 확정'];

function stepper(cur){return `<section class="box"><div class="stepper">${steps4.map((s,i)=>`<div class="stp ${i<cur?'done':''} ${i===cur?'cur':''}"><span class="c">${i<cur?I('check','sm'):i+1}</span>${s}</div>`).join('')}</div></section>`}
function head(){return `<div class="page-head"><button class="back-btn" data-blocked="뒤로">${I('arrowL')}</button><h1 class="page-title">내부 표준화</h1><span class="pin">${I('expand','xs')}</span><div class="right">평가명 : <b>[교육청연합] 2026년 2학년 2학기 국어</b></div></div>`}

function critHTML(d){
 return EL.map((e,ei)=>`<div class="crit-el">
  <div class="crit-row head"><span>Q1 평가요소 ${ei+1}</span><div class="txt" style="background:#fff">${e.name}</div><span class="k">총 배점</span><span class="v">${e.pt}</span></div>
  ${e.c.map((t,li)=>{const mine=ei===2&&li===1;const cls=['h','m','l'][li];
   const body=mine?(d.confirmed?`<div class="txt">${esc(d.crit)}<span class="mine-tag">내가 쓴 기준</span></div>`:`<textarea class="txt" id="myCrit" rows="2" placeholder="예: 결론은 타당하지만 근거와의 연결이나 표현을 보완해야 한다.">${esc(d.crit)}</textarea>`):`<div class="txt">${t}</div>`;
   return `<div class="crit-row"><span style="display:flex;align-items:center;gap:8px"><span class="lv ${cls}">${LV[li]}</span>${mine&&!d.confirmed?'<span class="mine-tag" style="margin:0">직접 작성</span>':''}</span>${body}<span class="k">배점</span><span class="v">${e.p[li]}</span></div>`}).join('')}
  <div class="crit-row" style="background:#fafbfc"><span style="font-weight:700;font-size:13px">확정정보</span><span style="color:#64748b;font-size:13px">${d.confirmed?'버전 v2 · 확정 · 류서준':'버전 v1 · 미확정 · 담당자 미지정'}</span><span></span><span></span></div>
 </div>`).join('');
}

function calc(sel){
 let m=0,step=0,w=0;sel.forEach((v,i)=>{const dd=Math.abs(v-STD[i]);if(!dd)m++;step+=dd;w+=EL[i].pt*dd*dd});
 const agree=Math.round(m/3*1000)/10, qwk=Math.max(0,1-w/10);
 let j='재연습',cls='red'; if(agree>=90&&qwk>=0.75){j='통과';cls='ok'} else if(agree>=85||qwk>=0.6){j='조건부 통과';cls='warn'}
 return {agree,qwk,step,j,cls,score:sel.reduce((a,v,i)=>a+EL[i].p[v],0)};
}

function page2(d){
 return head()+stepper(1)+`
 <section class="box"><div class="box-hd"><span class="ic">${I('cbox')}</span><div><h3>세부 채점기준</h3><p>표본답안 기준채점 결과를 바탕으로, 평가요소별로 인정할 근거를 상·중·하로 구체화합니다.</p></div><div class="right"><button class="btn sm" data-blocked="버전 이력">${I('clock','sm')} 버전 이력</button></div></div>
  <div class="box-bd"><div class="judge" style="margin:0 0 14px;background:#eef4ff;color:#1e40af">${I('help','sm')} 점수를 맞추는 것이 아니라, 기준을 함께 해석합니다. 평가요소 3의 ‘중’ 기준을 직접 입력해 보세요.</div>${critHTML(d)}</div></section>
 <div class="foot-bar"><button class="btn" data-blocked="이전 단계">${I('chevL','sm')} 표본 답안 채점</button><span class="note">${I('flag','sm')} 세부 채점기준을 확정하면 채점교사들에게 연습채점이 배정됩니다.</span><button class="btn primary" id="btnConfirm" ${d.crit.trim().length<4?'disabled':''}>세부 채점 기준 확정 / 다음 단계 ${I('chevR','sm')}</button></div>`;
}

function page3(d){
 const r=d.result;
 const rows=[['권서아','채점교사',[0,1,1]],['박시현','선임채점관',[0,1,1]]];
 const row=(n,role,res,me)=>`<tr class="${me?'me-row':''}"><td><b>${n}</b> <button class="btn sm" style="margin-left:6px;height:26px" ${me?'id="btnSeeMine"':'data-blocked="답안 보기"'}>${I('eye','xs')} 답안 보기</button></td><td>${role}</td><td>1/1</td><td><span class="pill gray">마감완료</span></td>
  <td><span class="pill ${res.agree>=90?'blue':'gray'}">${res.agree}%</span></td><td><span class="pill ${res.qwk>=0.75?'blue':'gray'}">${res.qwk.toFixed(3)}</span></td><td>${res.step} / 3</td><td><span class="pill ${res.cls}">${res.j}</span></td><td>${me?d.tries+'차':'1차'}</td>
  <td>${res.j==='통과'?'<span style="color:#94a3b8">—</span>':(me?`<button class="btn sm" id="btnRetry">${I('reset','xs')} 다시 맞춰 보기</button>`:'')}</td></tr>`;
 const sel=d.sel;
 return head()+stepper(2)+`
 <section class="box"><div class="box-hd"><span class="ic">${I('target')}</span><div><h3>연습 채점 시작</h3><p>연습답안을 채점자에게 배정하고 문서 기준의 단계 일치율과 QWK를 산출합니다.</p></div>
  <div class="right thr"><span>통과 일치율 90% + QWK 0.750</span><span>조건부 일치율 85% 또는 QWK 0.600</span></div></div>
  <div class="box-bd"><div class="kpis">
   <div class="kpi"><div><small>연습답안</small><b>1<em>건</em></b></div><span class="ic">${I('clip')}</span></div>
   <div class="kpi"><div><small>일치율 대상</small><b>1<em>건</em></b></div><span class="ic o">${I('users')}</span></div>
   <div class="kpi"><div><small>참여 채점자</small><b>3<em>명</em></b></div><span class="ic">${I('user')}</span></div>
   <div class="kpi"><div><small>채점 현황</small><b>3<em>/ 3</em></b></div><span class="ic">${I('bar')}</span></div></div>
   <div class="judge"><b>판정 기준</b><span><b>통과</b> 일치율 90% 이상이고 QWK 0.750 이상</span><span><b>조건부 통과</b> 일치율 85% 이상 또는 QWK 0.600 이상</span><span><b>재연습</b> 위 조건 미충족</span></div></div></section>
 <section class="box"><div class="box-hd"><span class="ic">${I('users')}</span><div><h3>채점자별 현황</h3><p>채점자별 연습채점 저장 진행과 마감 상태, 판정 결과를 보여줍니다.</p></div></div>
  <div class="box-bd"><table class="tbl"><thead><tr><th>채점자</th><th>역할</th><th>저장 진행</th><th>마감 상태</th><th>일치율</th><th>QWK</th><th>단계 오차</th><th>판정</th><th>시도</th><th>후속 조치</th></tr></thead><tbody>
   ${rows.map(([n,ro,s])=>row(n,ro,calc(s),false)).join('')}${row('체험 교사 (나)','채점교사',r,true)}</tbody></table>
   <div style="margin-top:16px;font-weight:700">내 판단과 기준채점 비교</div>
   <div class="cmp">${EL.map((e,i)=>`<div class="c ${sel[i]!==STD[i]?'diff':''}"><h5>${i+1}. ${e.name}</h5><div class="r"><span>기준채점(선임채점관)</span><b>${LV[STD[i]]} · ${e.p[STD[i]]}점</b></div><div class="r"><span>내 연습채점</span><b>${LV[sel[i]]} · ${e.p[sel[i]]}점</b></div><div class="r"><span>판단</span><b style="color:${sel[i]===STD[i]?'#227356':'#c2410c'}">${sel[i]===STD[i]?'일치':'기준과 차이'}</b></div></div>`).join('')}</div>
   <div style="font-size:12px;color:#94a3b8;margin-top:10px">시연용 화면: 연습답안 1건 기준으로 일치율·QWK를 간이 계산해 보여 줍니다.</div></div></section>`;
}

function dmHTML(d){
 const sel=d.sel;
 return `<div class="dm">
 <div class="dm-top"><img src="assets/logo.svg" alt="DEPTH"><span class="pill" style="background:#e8352b;color:#fff">연습 채점</span>
  <div class="nav">${I('chevL','sm')}<b>1번</b><span class="mute">1 / 1</span>${I('chevR','sm')}</div>
  <div class="meta"><span>시행: <b>[교육청연합] 2026년 2학년 2학기 국어</b></span><span>문항: <b>1번</b></span><span>수험번호: <b>2026-633968-0001</b></span><span>채점자: <b>체험 교사</b></span></div></div>
 <div class="dm-tool"><span class="cap">스탬프</span>${['check','check','qmark','x'].map(n=>`<span class="t">${I(n)}</span>`).join('')}<span class="t">${I('hash')}점수</span><span class="cap">표시</span><span class="t">${I('hl')}강조</span><span class="t">${I('underline')}밑줄</span><span class="t">${I('msg')}코멘트</span><span class="t">${I('eraser')}지우개</span><span class="t">${I('hand')}이동</span></div>
 <div class="dm-bar">${I('undo','sm')}${I('redo','sm')}<span class="btn sm" style="height:30px">${I('book','xs')} 문항·지문</span><div class="zoom">${I('zout','sm')}<span>120%</span>${I('zin','sm')}${I('fit','sm')}${I('expand','sm')}</div></div>
 <div class="dm-doc"><div class="dm-page"><div class="path">[교육청연합] 2026년 2학년 2학기 국어 / 1번 · 텍스트 답안</div><div class="exam">수험번호 : 2026-633968-0001</div><h2>문항 1</h2>
  <h4>지문</h4><div class="dm-box">비가 그친 뒤 운동장에는 작은 물웅덩이가 남았다. 아이들이 띄운 종이배는 바람에 흔들렸지만 끝내 뒤집히지 않았다. 화자는 젖은 흙 냄새를 맡으며 오래전 잃어버린 우산을 떠올렸다.</div>
  <h4>문제</h4><div class="dm-box">화자의 태도를 한 가지로 정리하고, 그렇게 판단한 근거를 두 가지 들어 설명하세요.</div>
  <h4>학생 답안 <span class="pill gray" style="margin-left:6px">연습답안</span></h4><div class="dm-ans">${ANSWER}</div></div></div>
 <div class="dm-side"><div class="hd">채점</div><div class="bd"><div class="dm-q"><div class="qh">문항 1 <b>${sel.filter(v=>v!=null).length?sel.reduce((a,v,i)=>a+(v==null?0:EL[i].p[v]),0):0} / 10</b></div>
  ${EL.map((e,ei)=>`<div class="dm-el ${sel[ei]==null?'cur':''}" id="el${ei}"><div class="eh"><span>${e.name} <small>(${e.pt}점)</small></span><b>${sel[ei]==null?0:e.p[sel[ei]]}점</b></div>
   ${[0,1,2].map(li=>{const t=(ei===2&&li===1)?d.crit:e.c[li];return `<button class="dm-lv ${sel[ei]===li?'sel':''}" data-el="${ei}" data-lv="${li}"><span>${esc(t)}${ei===2&&li===1?'<span class="mine">내가 쓴 기준</span>':''}</span><b>${e.p[li]}점</b></button>`}).join('')}</div>`).join('')}
  </div></div>
  <div class="ft"><div class="lbl2">채점 결과 저장</div><div style="font-size:12px;color:#6b7280">세 평가요소의 수준을 모두 고르면 연습채점이 저장됩니다.</div><button class="done" id="dmDone" disabled>${I('send','sm')} 연습채점 저장</button></div></div>
 <div class="dm-status"><span>${I('save','xs')} Auto-saved</span><span>Role: 채점교사 · 연습 채점</span></div></div>`;
}

function render(s){
 const d=s.data, main=document.getElementById('main'), dm=document.getElementById('dmRoot');
 if(d.phase==='crit'){main.innerHTML=page2(d);bindCrit()}
 else main.innerHTML=page3(d.result?d:Object.assign({},d,{result:calc(d.sel.map(v=>v??0))}));
 if(d.phase==='dm'){dm.innerHTML=dmHTML(d);bindDM()} else dm.innerHTML='';
 if(d.phase==='result') bindResult();
 if(d.phase==='dm'){Demo.setShell({crumb:['채점','연습 채점'],user:{name:'체험 교사',role:'채점교사'}})}
 else Demo.setShell({crumb:['채점','채점목록','상세'],user:{name:'류서준',role:'선임채점관'}});
}
let ct;
function bindCrit(){
 const ta=document.getElementById('myCrit'); if(!ta) return;
 ta.addEventListener('input',e=>{D.crit=e.target.value;Demo.save();document.getElementById('btnConfirm').disabled=D.crit.trim().length<4;clearTimeout(ct);if(D.crit.trim().length>=4&&S.step===0)ct=setTimeout(()=>Demo.step(1),1300)});
 document.getElementById('btnConfirm').onclick=()=>{if(D.crit.trim().length<4){Demo.toast('‘중’ 기준을 입력해 주세요');return}
  D.confirmed=true;D.phase='dm';Demo.save();Demo.toast('세부 채점기준이 확정되었습니다 · 채점교사 화면으로 바뀝니다');render(S);Demo.step(2)};
}
function bindDM(){
 document.querySelectorAll('.dm-lv').forEach(b=>b.onclick=async()=>{
  const ei=+b.dataset.el, li=+b.dataset.lv; D.sel[ei]=li; Demo.save(); render(S);
  const n=D.sel.filter(v=>v!=null).length; Demo.step(Math.min(4,2+n));
  const next=D.sel.findIndex(v=>v==null);
  if(next>=0){Demo.coach('#el'+next)}
  else{document.getElementById('dmDone').disabled=false;Demo.coach(null);Demo.toast('연습채점을 저장했습니다 · 선임채점관 화면에서 결과를 확인합니다');await Demo.wait(1500);
   D.result=calc(D.sel);D.phase='result';Demo.save();render(S);Demo.finish()}
 });
}
function bindResult(){
 const r=document.getElementById('btnRetry'); if(r) r.onclick=()=>{D.sel=[null,null,null];D.tries=(D.tries||1)+1;D.result=null;D.phase='dm';Demo.save();render(S);Demo.coach('#el0')};
 const m=document.getElementById('btnSeeMine'); if(m) m.onclick=()=>Demo.toast(`내 연습채점: ${D.sel.map((v,i)=>LV[v]).join(' · ')} (${D.result.score}점) / 기준채점 6점`);
}
