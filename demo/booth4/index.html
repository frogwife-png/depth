  var t=e.target.closest('#dxTarget'); e.preventDefault(); e.stopPropagation();
  if(t){ if(!Demo.state.started) return; Demo.go('main.html',1); }
  else Demo.toast("이 부스에서는 '"+BOOTH_CFG.screenName+"' 화면만 다룹니다");
},true);
</script></body></html>
